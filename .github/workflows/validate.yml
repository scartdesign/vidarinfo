name: Validate VIDAR

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate data and search regression
        run: node scripts/validate-data.mjs
      - name: Upload standalone preview
        uses: actions/upload-artifact@v4
        with:
          name: vidar-standalone-preview
          path: preview-standalone.html
          if-no-files-found: error
          retention-days: 7
