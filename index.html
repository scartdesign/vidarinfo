:root{

  --line:#dbe9de;

}
html,body{background:

body{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text);letter-spacing:-0.01em}
.shell{max-width:1240px;padding:0 20px}
.top{background:rgba(248,252,248,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(219,233,222,.8);box-shadow:0 6px 30px rgba(18,64,38,.04)}
.top-in{height:76px;gap:16px}
.brand{gap:12px}

.brand strong{font-size:24px;letter-spacing:-0.9px}

.desktop-search{max-width:640px}

.desktop-search input:focus,.hero-search input:focus{border-color:#9bc9a9;box-shadow:0 0 0 4px rgba(54,162,94,.12),0 12px 24px rgba(24,79,46,.07)}
.desktop-search input{height:48px;padding:0 46px 0 44px}
.search-ico{left:16px;color:#217c4c}
.top-actions{gap:10px}
.iconbtn{width:44px;height:44px;border-radius:15px;background:linear-gradient(180deg,#fff,#f7fbf8);box-shadow:var(--shadow-soft);transition:transform .18s, box-shadow .18s}
.iconbtn:hover,.quick button:hover,.topic:hover,.trend:hover,.sourcebtn:hover,.source:hover,.setting:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.main{padding-top:28px}
.hero{padding:42px 40px;border-radius:34px;background:
 linear-gradient(135deg, rgba(227,245,232,.95) 0%, rgba(255,255,255,.98) 60%, rgba(240,249,242,.98) 100%);border:1px solid #d8e8dc;box-shadow:0 22px 54px rgba(23,76,41,.08)}

.hero h1{margin:14px 0 12px;max-width:760px;font-size:clamp(38px,5vw,60px);letter-spacing:-2.4px;line-height:1.02}

const MEMORY_QUERIES=['sinusi','prostata','kašalj','šećer','pritisak','zglobovi','kandida','hemoroidi','nesanica','želudac','ciste','imunitet'];
const RECALL_SYNONYMS={
  'secer':['šećer','dijabetes','glukoza','insulin'], 'dijabetes':['šećer','glukoza','insulin'],
  'pritisak':['krvni pritisak','hipertenzija'], 'prostata':['mokrenje','noćno mokrenje','muško zdravlje'],
  'sinusi':['nos','zapušen nos','sekret','sinusitis'], 'kasalj':['kašalj','grlo','prehlada'],
  'zeludac':['želudac','stomak','gastritis','refluks','gorušica'], 'hemoroidi':['šuljevi','čmar','rektalno'],
  'kandida':['candida','gljivice','gljivična infekcija'], 'zglobovi':['zglob','artritis','bolovi','upala'],
  'ciste':['cista','jajnici','ovarijalno'], 'nesanica':['san','spavanje','melatonin'],
  'imunitet':['imuni sistem','otpornost','prehlada'], 'detoks':['detox','čišćenje','čisti organizam'],
  'crno':['crni','black','tamno'], 'ulje':['oil','kapi','ekstrakt'], 'caj':['čaj','tea','biljni čaj'],
  'melem':['mast','balzam','krema','ointment','salve'], 'sirup':['syrup','sok'], 'kapi':['drops','tinktura','ekstrakt'],
  'kapsule':['capsules','tablete','suplement'], 'prirodni':['biljni','herbal','narodni','domaći']
};
const RECALL_FORMS=['Sve','Čaj','Ulje','Kapi / tinktura','Melem / mast','Sirup / sok','Kapsule / suplement','Kućni recept'];
const RECALL_PROBLEMS=['Sve','Sinusi','Kašalj / grlo','Prostata / mokrenje','Šećer','Pritisak','Zglobovi','Kandida','Hemoroidi','Želudac / refluks','Nesanica','Imunitet','Ciste / žensko zdravlje'];
function recallExpand(q){let raw=norm(q);let words=raw.split(/\s+/).filter(Boolean),out=[raw];for(let w of words){out.push(w);let vals=RECALL_SYNONYMS[w]||RECALL_SYNONYMS[norm(w)];if(vals)out.push(...vals.map(norm))}return [...new Set(out.filter(Boolean))]}
function recallForm(n){let b=norm([n.name,n.claim,...(n.aliases||[])].join(' '));if(/melem|mast|balzam|krema|ointment|salve/.test(b))return 'Melem / mast';if(/sirup|sok|syrup/.test(b))return 'Sirup / sok';if(/tinktura|kapi|drops|ekstrakt/.test(b))return 'Kapi / tinktura';if(/ulje|oil/.test(b))return 'Ulje';if(/čaj|caj|tea/.test(b))return 'Čaj';if(/kapsul|tablet|suplement/.test(b))return 'Kapsule / suplement';if(/recept|luk|oblog|ispiranje|rastvor/.test(b))return 'Kućni recept';return 'Drugo'}
function recallProblem(n){let b=naturalBlobBase(n);let map=[['Sinusi',['sinus','nos','zapušen']],['Kašalj / grlo',['kašalj','kasalj','grlo','prehlad']],['Prostata / mokrenje',['prostat','mokren']],['Šećer',['dijabet','šećer','secer','glukoz']],['Pritisak',['pritisak','hipertenz']],['Zglobovi',['zglob','artrit','upala']],['Kandida',['kandid','candida','gljivic']],['Hemoroidi',['hemoroid','šulj']],['Želudac / refluks',['želud','zelud','refluks','goruš','stomak']],['Nesanica',['nesanic','spavanje','san']],['Imunitet',['imunit','otpornost']],['Ciste / žensko zdravlje',['cist','jajnik','menopauz','pms']]];for(let [k,terms] of map)if(terms.some(t=>b.includes(norm(t))))return k;return 'Ostalo'}
function naturalBlobBase(n){let topicWords=(n.topics||[]).map(id=>{let t=topicById(id);return t?[t.title,t.category,t.intro,...(t.aliases||[]),...(t.symptoms||[])].join(' '):''});return norm([n.name,n.group,n.claim,n.evidence,n.safety,...(n.aliases||[]),...(n.platforms||[]),...topicWords].join(' '))}
function naturalMatchScore(n,q){let terms=searchTerms(q);if(!terms.length)return 0;let name=norm(n.name),aliases=(n.aliases||[]).map(norm),topicText=(n.topics||[]).map(id=>{let t=topicById(id);return t?[t.title,...(t.aliases||[]),...(t.symptoms||[])].join(' '):''}).join(' '),body=norm([n.group,n.claim,n.evidence,n.safety].join(' ')),score=0,hitSet=new Set(),core=terms.join(' ');if(name===norm(q)||name===core)score+=160;if(aliases.some(a=>a===norm(q)||a===core))score+=135;let fields=[[name,14],...[aliases.map(a=>[a,12])],[topicText,10],[body,3]];for(let [field,w] of fields){let r=textTokenScore(terms,field,w);score+=r.score;if(r.hits)for(let term of terms){if(textTokenScore([term],field,1).hits)hitSet.add(term)}}if(!hitSet.size)return 0;let minHits=terms.length>1?Math.ceil(terms.length*.6):1;if(hitSet.size<minHits)return 0;if(hitSet.size===terms.length)score+=45+terms.length*8;else score-=20*(terms.length-hitSet.size);return Math.max(score,0)}

function traceSection(){return `<section class="section trace-section"><div class="section-head"><div><span class="section-kicker">Tvoj trag</span><h2>Video si nešto, ali još ne znaš šta je?</h2><p>Sačuvaj ono čega se sećaš. Ostaje samo na ovom uređaju.</p></div></div><div class="trace-grid"><div class="trace-panel"><span class="section-kicker">Sačuvaj trag</span><h2>Ne dozvoli da objava nestane</h2><p>Napiši dve-tri reči koje pamtiš ili nalepi link ako ga još imaš.</p><div class="trace-form"><div class="trace-form-row"><select id="tracePlatform"><option>Facebook</option><option>TikTok</option><option>Instagram</option><option>YouTube</option><option>Drugo</option></select><input id="traceUrl" inputmode="url" placeholder="Link objave — opciono"></div><textarea id="traceNote" placeholder="Npr. crno ulje za sinuse, žena priča da se stavljaju 3 kapi..."></textarea><button class="trace-save" id="saveTrace">Sačuvaj trag</button></div><div class="trace-note">VIDAR ovaj zapis ne šalje na server. Namenjen je samo da ti pomogne da kasnije ponovo nađeš ono što si video.</div></div><div class="trace-panel"><span class="section-kicker">Moji tragovi</span><h2>${networkClips.length?networkClips.length+' sačuvanih':'Još nema sačuvanih'}</h2><div class="trace-list">${networkClips.length?networkClips.map(traceCard).join(''):'<div class="trace-empty">Kad sledeći put vidiš neki čaj, melem, kapi ili „lek“ na mreži — samo ga ovde zapiši.</div>'}</div></div></div></section>`}
function memoryHero(){return `<section class="memory-hero"><span class="memory-eyebrow">${uiIcon('radar')} Nađi po sećanju</span><h2>„Video sam nešto na Fejsu, ali ne znam kako se zove…“</h2><p>Ne moraš da znaš naziv. VIDAR sada spaja ono čega se sećaš: problem, oblik preparata, mrežu, sastojak, boju ili deo tvrdnje.</p><div class="memory-search"><label class="memory-searchbox"><span>${uiIcon('search')}</span><input id="memorySearch" value="${esc(state.natQ)}" placeholder="Npr. crno ulje za prostatu, melem sa nevenom, čaj za šećer…"></label><button class="memory-go" id="memoryGo">Pronađi</button></div><div class="recall-builder"><div><label>Za šta je bilo?</label><select id="recallProblem">${RECALL_PROBLEMS.map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Šta je bilo?</label><select id="recallForm">${RECALL_FORMS.map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Gde si video?</label><select id="recallPlatform"><option>Sve</option><option>Facebook</option><option>TikTok</option><option>Instagram</option><option>YouTube</option></select></div><button id="recallBuild">Sastavi pretragu</button></div><div class="memory-chips">${MEMORY_QUERIES.map(q=>`<button data-memory-q="${esc(q)}">${esc(q)}</button>`).join('')}</div><div class="memory-examples"><div class="memory-example"><strong>Pamtiš samo izgled?</strong><span>Probaj „crno ulje“, „zeleni melem“, „kapi“, „sirup“.</span></div><div class="memory-example"><strong>Pamtiš problem?</strong><span>Izaberi tegobu i oblik preparata — VIDAR će suziti katalog.</span></div><div class="memory-example"><strong>Pamtiš mrežu?</strong><span>Dodaj Facebook, TikTok, Instagram ili YouTube kao trag.</span></div></div></section>`}
function naturalPage(){state.view='natural';let cats=['Sve',...new Set(NATURALS.map(n=>n.group))],plats=['Sve',...new Set(NATURALS.flatMap(n=>n.platforms||[]))],list=naturalFiltered(),risky=list.filter(n=>n.status==='avoid').slice(0,5),hasQ=!!state.natQ.trim();return `${header()}<main class="shell main"><section class="page-head natural-page-head"><div><span class="section-kicker">Mrežni radar</span><h1>Prirodni preparati i saveti koje ljudi dele</h1><p>Jedno mesto za ono što viđaš na Facebooku, TikToku, Instagramu i drugim mrežama — čak i kada kasnije ne možeš da se setiš gde si to video.</p></div><span class="page-count">${NATURALS.length}<small>poznatih tvrdnji</small></span></section>${memoryHero()}<section class="natural-warning"><span>${uiIcon('shield')}</span><div><strong>VIDAR pamti tvrdnju — ne proglašava je lekom.</strong><p>Prikazujemo šta ljudi nude i tvrde, pa odvojeno šta znamo o dokazima i bezbednosti. „Prirodno“ ne znači automatski bezbedno.</p></div></section><section class="section filter-surface natural-filter"><div class="natural-search"><span class="search-ico">${uiIcon('search')}</span><input id="naturalSearch" value="${esc(state.natQ)}" placeholder="Pretraži po nazivu, tegobi, sastojku ili delu tvrdnje…"></div>${state.natQ.trim()?'':recentSearchStrip('natural')}<div class="filter-label">Gde si možda video</div><div class="chips">${plats.map(p=>`<button class="chip ${state.natPlatform===p?'active':''}" data-natplatform="${esc(p)}">${esc(p)}</button>`).join('')}</div><div class="filter-label">Vrsta / oblast</div><div class="chips">${cats.map(c=>`<button class="chip ${state.natCat===c?'active':''}" data-natcat="${esc(c)}">${esc(c)}</button>`).join('')}</div><div class="filter-label">Nivo dokaza</div><div class="chips"><button class="chip ${state.natEvidence==='Sve'?'active':''}" data-natevidence="Sve">Sve</button><button class="chip ${state.natEvidence==='supported'?'active':''}" data-natevidence="supported">Postoje dokazi</button><button class="chip ${state.natEvidence==='limited'?'active':''}" data-natevidence="limited">Ograničeni dokazi</button><button class="chip ${state.natEvidence==='none'?'active':''}" data-natevidence="none">Nema dobrih dokaza</button><button class="chip ${state.natEvidence==='avoid'?'active':''}" data-natevidence="avoid">Potencijalno rizično</button><button class="chip ${state.natSaved?'active':''}" data-natsaved="1">♥ Sačuvano</button></div>${hasQ?`<div class="catalog-context"><span>Tražiš: <b>${esc(state.natQ)}</b></span><span>${list.length} pogodaka u katalogu</span>${searchShareButton(state.natQ)}</div>`:''}</section>${risky.length?`<section class="section"><div class="section-head"><div><span class="section-kicker danger-kicker">Poseban oprez</span><h2>Viralno, ali potencijalno rizično</h2><p>Ove tvrdnje su posebno važne za proveru pre nego što ih neko isproba.</p></div></div><div class="natural-risk-row">${risky.map(n=>`<button data-natural="${n.id}"><strong>${esc(n.name)}</strong><span>${(n.platforms||[]).join(' · ')}</span></button>`).join('')}</div></section>`:''}<section class="section surface-section"><div class="section-head"><div><span class="section-kicker">Katalog sa mreža</span><h2>${list.length} pronađenih stavki</h2><p>Šta se tvrdi → gde se pojavljuje → nivo dokaza → bezbednost → izvori.</p></div></div>${list.length?`<div class="natural-grid">${list.map(naturalCard).join('')}</div>`:`<div class="recall-empty"><h3>Još nemamo tu tvrdnju u katalogu.</h3><p>To ne znači da ne postoji na mrežama. Sačuvaj ono čega se sećaš ili proveri povezane zdravstvene teme.</p>${looseTopicSuggestions(state.natQ,3).length?`<div class="search-empty-near"><small>Povezane teme</small><div>${looseTopicSuggestions(state.natQ,3).map(t=>`<button data-topic="${t.id}">${esc(t.title)}</button>`).join('')}</div></div>`:''}<div class="quick-actions"><button id="jumpTrace">Sačuvaj trag</button><button id="naturalSearchTopics">Pretraži teme</button><button id="clearNaturalSearch">Očisti pretragu</button></div></div>`}</section>${traceSection()}<section class="section source-section"><div class="section-head"><div><span class="section-kicker">Ponovo pronađi objavu</span><h2>Pretraži mreže direktno</h2><p>VIDAR ti pravi pretragu iz izraza koji pamtiš. Rezultati sa mreža su iskustva i tvrdnje, ne medicinski dokaz.</p></div></div>${sourceExplorer(state.natQ||'prirodni preparat zdravlje iskustva')}</section></main>${nav()}`}
function naturalDetail(n){state.view='naturaldetail';let topics=canonicalTopicIds(n.topics||[]).map(topicById).filter(Boolean);return `${header()}<main class="shell main"><button class="back" id="backNaturals">${uiIcon('arrow')} Nazad na prirodne pristupe</button><section class="natural-detail-head"><div><span class="kicker">${uiIcon('leaf')} ${esc(n.group)}</span><h1>${esc(n.name)}</h1><div class="natural-platforms large">${(n.platforms||[]).map(p=>`<span>${esc(p)}</span>`).join('')}</div><p>${esc(n.claim)}</p><div class="detail-actions"><button class="primary" data-save-natural="${n.id}">${savedNaturals.has(n.id)?'♥ Sačuvano':'♡ Sačuvaj'}</button><span class="detail-safe">${uiIcon('shield')} Informativno, nije preporuka</span></div></div><div class="natural-detail-badge">${badge(n.status)}</div></section><div class="natural-detail-grid"><section class="card"><div class="card-label">${uiIcon('radar')} Šta se tvrdi na mrežama</div><h2>Popularna tvrdnja</h2><p class="lead">${esc(n.claim)}</p><div class="natural-social-search">${(n.platforms||[]).map(p=>{let c=channels.find(x=>x[0]===p);return c?`<a target="_blank" rel="noopener" href="${esc(c[2](n.name+' '+n.claim))}">${esc(p)} ↗</a>`:''}).join('')}</div></section><section class="card evidence-card"><div class="card-label">${uiIcon('shield')} Šta kažu dokazi</div><h2>${statusMap[n.status]?.[0]||'Procena dokaza'}</h2><p class="lead">${esc(n.evidence)}</p>${n.evidenceHref?`<a class="evidence-link" target="_blank" rel="noopener" href="${esc(n.evidenceHref)}">Dodatni izvor za proveru ↗</a>`:''}</section><section class="card"><div class="card-label">! Bezbednost</div><h2>Na šta obratiti pažnju</h2><div class="alert ${n.status==='avoid'?'danger':'info'}"><strong>${n.status==='avoid'?'Ne isprobavati naslepo':'Važno'}</strong><p>${esc(n.safety)}</p></div></section><aside class="card source-card"><div class="card-label">🇷🇸 Srbija prvo</div><h2>Proveri proizvod i tvrdnju</h2>${naturalSerbiaLinks(n)}</aside></div><section class="section network-again"><strong>Video si ovo ranije na mreži?</strong><p>Probaj da pronađeš objavu ponovo koristeći naziv i tvrdnju kao trag.</p><div class="natural-social-search">${(n.platforms||[]).map(p=>{let c=channels.find(x=>x[0]===p);return c?`<a target="_blank" rel="noopener" href="${esc(c[2](n.name+' '+n.claim))}">Pretraži ${esc(p)} ↗</a>`:''}).join('')}</div></section>${topics.length?`<section class="section"><div class="section-head"><div><span class="section-kicker">Povezane teme</span><h2>Gde se ovaj pristup najčešće pominje</h2></div></div><div class="recent-wrap">${topics.map(t=>`<button class="recent-card" data-topic="${t.id}"><span>${esc(t.category)}</span><strong>${esc(t.title)}</strong><small>Otvori temu →</small></button>`).join('')}</div></section>`:''}<section class="section source-section"><div class="section-head"><div><span class="section-kicker">Pretraži javne izvore</span><h2>Šta još ljudi pišu?</h2><p>Rezultati sa mreža predstavljaju javni sadržaj i iskustva, ne dokaz efikasnosti.</p></div></div>${sourceExplorer(n.name)}</section></main>${nav()}`}

function topics(kind='topics'){state.view=kind;let cats=['Sve',...new Set(catalogTopics().map(x=>x.category))],list=filtered(),hasQ=kind!=='saved'&&!!state.q.trim();return `${header()}<main class="shell main"><section class="page-head"><div><span class="section-kicker">${kind==='saved'?'Lokalno sačuvano':'VIDAR baza'}</span><h1>${kind==='saved'?'Sačuvane teme':'Zdravstvene teme'}</h1><p>${kind==='saved'?'Ove teme ostaju samo na tvom uređaju.':catalogTopics().length+' jedinstvenih tema — pretraži po nazivu, simptomu ili pojmu.'}</p></div><span class="page-count">${list.length}<small>${kind==='saved'?'sačuvano':'prikazano'}</small></span></section><section class="section filter-surface"><div class="chips">${cats.map(c=>`<button class="chip ${state.cat===c?'active':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}</div>${hasQ?`<div class="catalog-context"><span>Tražiš: <b>${esc(state.q)}</b></span><span>${list.length} povezanih tema</span>${searchShareButton(state.q)}</div>`:recentSearchStrip('topics')}${hasQ?urgentSearchBanner(state.q):''}<div class="grid">${list.length?list.map(topicCard).join(''):(kind==='saved'?'<div class="empty">Još nema sačuvanih tema.</div>':topicEmptyPanel(state.q))}</div></section></main>${nav()}`}


function savedPage(){state.view='saved';let topicItems=catalogTopics().filter(t=>saved.has(t.id)),medItems=savedMedItems(),naturalItems=NATURALS.filter(n=>savedNaturals.has(n.id));return `${header()}<main class="shell main"><section class="page-head"><div><span class="section-kicker">Lokalno sačuvano</span><h1>Sačuvano</h1><p>Teme, lekovi i preparati koje si sačuvao ostaju samo na ovom uređaju.</p></div><span class="page-count">${topicItems.length+medItems.length+naturalItems.length}<small>ukupno</small></span></section><section class="section saved-section"><div class="section-head"><div><h2>Zdravstvene teme</h2><p>${topicItems.length?topicItems.length+' sačuvanih tema':'Još nema sačuvanih zdravstvenih tema.'}</p></div>${topicItems.length?'<button class="textbtn" id="clearSaved">Obriši teme</button>':''}</div><div class="grid">${topicItems.length?topicItems.map(topicCard).join(''):'<div class="empty">Sačuvaj temu pritiskom na srce na kartici ili stranici teme.</div>'}</div></section><section class="section saved-section"><div class="section-head"><div><h2>Lekovi i preparati</h2><p>${medItems.length?medItems.length+' sačuvanih stavki':'Još nema sačuvanih lekova ili preparata.'}</p></div>${medItems.length?'<button class="textbtn" id="clearSavedMeds">Obriši preparate</button>':''}</div><div class="med-grid saved-med-grid">${medItems.length?medItems.map(medCard).join(''):'<div class="empty">Sačuvaj lek ili preparat na njegovoj kartici ili stranici.</div>'}</div></section><section class="section saved-section"><div class="section-head"><div><h2>Prirodni pristupi</h2><p>${naturalItems.length?naturalItems.length+' sačuvanih stavki':'Još nema sačuvanih prirodnih pristupa.'}</p></div>${naturalItems.length?'<button class="textbtn" id="clearSavedNaturals">Obriši prirodno</button>':''}</div><div class="natural-grid">${naturalItems.length?naturalItems.map(naturalCard).join(''):'<div class="empty">Sačuvaj prirodni pristup pritiskom na srce na njegovoj kartici.</div>'}</div></section></main>${nav()}${compareTray()}`}

function radar(){state.view='radar';let plats=['Sve',...new Set(DB.trendData.map(x=>x.platform))],rows=state.source==='Sve'?DB.trendData:DB.trendData.filter(x=>x.platform===state.source);return `${header()}<main class="shell main"><section class="page-head radar-page-head"><div><span class="section-kicker">VIDAR Radar</span><h1>Tvrdnje sa mreža, odvojene od dokaza.</h1><p>Javni sadržaj nije medicinski dokaz. Zato svaku tvrdnju prikazujemo uz poseban pregled onoga što izvori zaista podržavaju.</p></div><div class="radar-orbit">${uiIcon('radar')}<span>${rows.length}</span></div></section><section class="section filter-surface"><div class="radar-search"><div class="searchbox"><span class="search-ico">${uiIcon('search')}</span><input id="radarSearch" value="${esc(state.q)}" placeholder="Npr. magnezijum, beli luk, brusnica…"></div><button id="radarGo">Pretraži mreže</button></div><div class="chips">${plats.map(p=>`<button class="chip ${state.source===p?'active':''}" data-source="${esc(p)}">${esc(p)}</button>`).join('')}</div><div class="radar-grid">${rows.map(trendCard).join('')}</div></section><section class="section source-section"><div class="section-head"><div><span class="section-kicker">Pretraga mreža</span><h2>Pretraži svih 7 izvora</h2><p>Otvori javne rezultate za pojam koji te zanima.</p></div></div>${sourceExplorer(state.q||'zdravlje prirodni pristupi')}</section></main>${nav()}`}

function listBlock(title,a){return `<h3>${title}</h3><ul>${(a||[]).map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}
function topicNaturalItems(t){let base=(t.natural||[]).map(x=>({...x,_key:norm(x.name)}));let seen=new Set(base.map(x=>x._key));let auto=NATURALS.filter(n=>(n.topics||[]).some(id=>canonicalTopicId(id)===t.id)).filter(n=>!seen.has(norm(n.name))).slice(0,8).map(n=>({name:n.name,status:n.status,note:n.evidence||n.claim,_key:norm(n.name)}));return [...base,...auto].slice(0,10)}function remedyBlock(title,a){return `<section class="card"><h2>${title}</h2>${(a||[]).length?(a||[]).map(x=>`<div class="remedy"><div class="remedy-head"><strong>${esc(x.name)}</strong>${badge(x.status)}</div><p>${esc(x.note)}</p></div>`).join(''):'<p>Nema dodatih stavki.</p>'}</section>`}
function detail(t){state.view='detail';touchRecent(t.id);let s=srSources(t);return `${header()}<main class="shell main"><button class="back" id="back">${uiIcon('arrow')} Nazad na teme</button>${topicEmergencyBanner(t)}<section class="detail-head ${tone(t.category)}"><div class="detail-main"><span class="kicker">${esc(t.category)}</span><h1>${esc(t.title)}</h1><p>${esc(t.intro)}</p><div class="detail-actions"><button class="primary" data-save="${t.id}">${saved.has(t.id)?'♥ Sačuvano':'♡ Sačuvaj temu'}</button><button class="sharebtn" data-share="${t.id}">${uiIcon('globe')} Podeli</button><span class="detail-safe">${uiIcon('shield')} Informativni sadržaj</span></div></div><div class="detail-mark"><div>${esc(t.icon||'✚')}</div><span>${esc(t.category)}</span></div></section><div class="tabs"><button data-scroll="pregled">Pregled</button><button data-scroll="simptomi">Simptomi</button><button data-scroll="prirodno">Prirodno</button><button data-scroll="mreze">Mreže</button><button data-scroll="izvori">Izvori</button></div><div class="detail-grid" id="pregled"><section class="card evidence-card"><div class="card-label">${uiIcon('shield')} Medicinski pregled</div><h2>Šta kažu medicinski izvori</h2><p class="lead">${esc(t.evidence||t.intro)}</p><div class="alert info"><strong>Važno:</strong> opis simptoma ne znači da VIDAR potvrđuje da ih imaš niti postavlja dijagnozu.</div><div id="simptomi" class="info-columns">${listBlock('Simptomi koji se opisuju kod ove teme',t.symptoms)}${listBlock('Opšte mere i samopomoć',t.selfCare)}${listBlock('Kada potražiti zdravstvenog radnika',t.doctor)}</div>${(t.urgent||[]).length?`<div class="alert danger"><strong>Znaci za hitnu procenu</strong><ul>${t.urgent.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}</section><aside class="card source-card" id="izvori"><div class="card-label">🇷🇸 Prioritet: Srbija</div><h2>Domaći medicinski izvori</h2><p>Prvo prikazujemo relevantne izvore iz Srbije.</p>${s.map((x,i)=>{let off=/Batut|Ministarstvo|ALIMS/i.test(x.n);return `<a class="source ${off?'official':''}" target="_blank" rel="noopener" href="${esc(x.u)}"><span class="source-num">${String(i+1).padStart(2,'0')}</span><span><strong>${esc(x.n)}</strong><small>${esc(x.m)}</small><em class="source-type">${off?'Zvanični izvor':'Domaći medicinski izvor'}</em></span>${uiIcon('chevron')}</a>`}).join('')}<div class="alert info">Informacije su opšte i ne predstavljaju izbor leka, doze ili terapije.</div></aside></div><section id="prirodno" class="section split-section"><div>${remedyBlock('Prirodni pristupi i nivo dokaza',topicNaturalItems(t))}</div><div><section class="card"><div class="card-label">${uiIcon('radar')} Iskustva i mreže</div><h2>Šta ljudi preporučuju</h2>${(t.social||[]).map(x=>`<div class="remedy"><div class="remedy-head"><strong>${esc(x.name)}</strong>${badge(x.status)}</div><p>${esc(x.note)}</p></div>`).join('')||'<p>Nema dodatih saveta.</p>'}</section></div></section>${topicContextActions(t)}${relatedMedsBlock(t)}${relatedTopicsForTopicBlock(t)}<section class="card network-card" id="mreze"><div class="card-label">${uiIcon('globe')} Javni internet</div><h2>Pretraži ovu temu na mrežama</h2><p>Otvori javnu pretragu na izabranom servisu. Objave na mrežama nisu medicinski dokaz.</p>${sourceExplorer(t.title+' '+(t.aliases||[]).slice(0,2).join(' '))}</section></main>${nav()}`}


function medFiltered(){let x=[...MEDS];if(state.medCat!=='Sve')x=x.filter(m=>m.group===state.medCat);if(state.medLetter!=='Sve')x=x.filter(m=>norm(m.name).startsWith(norm(state.medLetter)));let q=state.medQ.trim();if(q)return rankMeds(q,x);return x.sort((a,b)=>a.name.localeCompare(b.name,'sr',{sensitivity:'base'}))}
function medCard(m){let kind=medKind(m);return `<article class="med-card" data-med="${m.id}" role="button" tabindex="0" aria-label="Otvori informacije za ${esc(m.name)}"><div class="med-card-top"><span class="med-icon med-kind-${kind.short.toLowerCase()}">${kind.short}</span><div class="med-card-actions"><span class="med-group">${esc(m.group)}</span><button class="med-save" data-save-med="${m.id}" aria-label="Sačuvaj lek ili preparat">${savedMeds.has(m.id)?'♥':'♡'}</button></div></div><h3>${esc(m.name)}</h3><span class="med-active">${esc(m.active)}</span><p>${esc(m.about)}</p><div class="med-card-compare"><button class="compare-mini ${compareMeds.includes(m.id)?'active':''}" data-compare-med="${m.id}">${compareMeds.includes(m.id)?'✓ U poređenju':'⇄ Poredi'}</button></div><button class="med-open med-open-btn" type="button" data-open-med="${m.id}">Otvori informacije <span>→</span></button></article>`}
function miniMedCard(m){let kind=medKind(m);return `<button class="mini-med-card" data-open-med="${m.id}"><span class="mini-med-icon">${kind.short}</span><span class="mini-med-copy"><small>${esc(m.group)}</small><strong>${esc(m.name)}</strong><em>${esc(m.active)}</em></span><span class="mini-med-arrow">→</span></button>`}
function medShelf(title,subtitle,items,clearId=''){if(!items.length)return '';return `<section class="med-shelf"><div class="section-head compact-head"><div><span class="section-kicker">Lokalno na uređaju</span><h2>${title}</h2><p>${subtitle}</p></div>${clearId?`<button class="textbtn" id="${clearId}">Obriši</button>`:''}</div><div class="mini-med-grid">${items.map(miniMedCard).join('')}</div></section>`}function popularMedItems(){let ids=['ibuprofen','paracetamol','pantoprazol','cefixime','cetirizin','amlodipin','vitamin-d3','magnezijum','atorvastatin','metformin'];return ids.map(id=>MEDS.find(m=>m.id===id)).filter(Boolean)}
function medLetters(){return ['Sve',...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').filter(l=>MEDS.some(m=>norm(m.name).startsWith(norm(l))))]}
function medEmptyPanel(q){let near=looseTopicSuggestions(q,3);return `<div class="search-empty med-empty"><span class="search-empty-icon">${uiIcon('shield')}</span><h3>Nema sigurnog poklapanja u bazi lekova</h3><p>Probaj naziv brenda ili aktivne supstance. VIDAR ne bira terapiju prema simptomu.</p>${near.length?`<div class="search-empty-near"><small>Povezane zdravstvene teme</small><div>${near.map(t=>`<button data-topic="${t.id}">${esc(t.title)}</button>`).join('')}</div></div>`:''}<div class="search-empty-actions"><button id="clearMedSearch">Očisti pretragu</button><button id="medSearchTopics">Pretraži teme</button><button id="medSearchNatural">Pretraži prirodno</button></div></div>`}
function medsPage(){state.view='meds';let cats=['Sve',...new Set(MEDS.map(m=>m.group))],letters=medLetters(),list=medFiltered(),rm=recentMedItems(),sm=savedMedItems().slice(0,5),popular=popularMedItems();return `${header()}<main class="shell main"><section class="page-head meds-page-head"><div><span class="section-kicker">VIDAR baza preparata</span><h1>Lekovi i preparati</h1><p>Pretraži po nazivu, brendu, aktivnoj supstanci ili kategoriji. Informacije su opšte — VIDAR ne bira terapiju i ne određuje dozu.</p></div><div class="med-page-count"><strong>${MEDS.length}</strong><span>lekova i preparata</span></div></section><div class="app-tabs"><button class="app-tab" data-nav="topics">Zdravstvene teme</button><button class="app-tab active">Lekovi i preparati</button></div><div class="meds-intro meds-intro-v20"><div class="med-search"><span class="search-ico">${uiIcon('search')}</span><input id="medSearch" value="${esc(state.medQ)}" placeholder="Npr. Andol, ibuprofen, pantoprazol, alergija…"><button id="medGo">Pretraži</button></div><aside class="meds-note"><strong>Informativno, ne terapijski.</strong><p>Za dozu, kombinovanje, trudnoću, hronične bolesti i promenu propisane terapije proveri odobreno uputstvo i razgovaraj sa lekarom ili farmaceutom.</p></aside></div>${state.medQ.trim()?'':recentSearchStrip('meds')}<section class="med-discovery"><div class="med-discovery-head"><div><span class="section-kicker">Brzi pristup</span><h2>Često traženo</h2></div></div><div class="med-popular-grid">${popular.map(miniMedCard).join('')}</div></section>${medShelf('Nedavno gledano','Brzo se vrati na preparate koje si otvarao na ovom uređaju.',rm,'clearRecentMeds')}${medShelf('Sačuvani lekovi i preparati','Tvoje sačuvane stavke, samo na ovom uređaju.',sm,'')}<div class="med-stat-row med-stat-row-v20"><span><strong>${MEDS.length}</strong><small>ukupno</small></span><span><strong>${new Set(MEDS.map(m=>m.group)).size}</strong><small>kategorija</small></span><span><strong>${list.length}</strong><small>prikazano</small></span><span><strong>${savedMeds.size}</strong><small>sačuvano</small></span></div><section class="med-browser"><div class="med-browser-label"><span>Kategorija</span><button class="med-reset" id="medReset">Resetuj filtere</button></div><div class="chips med-cat-chips">${cats.map(c=>`<button class="chip ${state.medCat===c?'active':''}" data-medcat="${esc(c)}">${esc(c)}${c!=='Sve'?` <small>${MEDS.filter(m=>m.group===c).length}</small>`:''}</button>`).join('')}</div><div class="med-browser-label"><span>A–Z</span><small>filtriraj po početnom slovu</small></div><div class="med-az">${letters.map(l=>`<button class="azbtn ${state.medLetter===l?'active':''}" data-medletter="${l}">${l}</button>`).join('')}</div></section><div class="med-result-head"><div><h2>${state.medQ||state.medCat!=='Sve'||state.medLetter!=='Sve'?'Rezultati':'Svi lekovi i preparati'}</h2><p>${list.length} prikazanih stavki</p></div>${state.medQ?searchShareButton(state.medQ):''}</div><div class="med-grid">${list.length?list.map(medCard).join(''):medEmptyPanel(state.medQ)}</div></main>${nav()}${compareTray()}`}

function medAliasChips(m){let a=(m.aliases||[]).filter(x=>norm(x)!==norm(m.name)&&norm(x)!==norm(m.active)).slice(0,6);return a.length?`<div class="med-aliases"><span>Često se traži i kao</span><div>${a.map(x=>`<em>${esc(x)}</em>`).join('')}</div></div>`:''}

div class="check-list verify-list">${(m.check||[]).map(x=>`<div class="check-row"><i>✓</i><span>${esc(x)}</span></div>`).join('')}</div></section><aside class="card official-card" id="officialSources"><div class="card-label">🇷🇸 Zvanični izvori</div><h2>Proveri konkretan lek</h2><p class="official-intro">Različiti brendovi i jačine mogu imati različita uputstva. Uvek proveri baš proizvod koji koristiš.</p><div class="official-stack"><a class="official-link official-link-main" target="_blank" rel="noopener" href="https://registar.alims.gov.rs/"><span class="official-badge">AL</span><span><strong>ALIMS — Nacionalni registar lekova</strong><small>Odobreno uputstvo za pacijenta i dokumentacija leka</small></span><b>↗</b></a><a class="official-link" target="_blank" rel="noopener" href="https://rfzo.rs/osiguranalica/lekovi-info/pravo-lek"><span class="official-badge rfzo">RF</span><span><strong>RFZO — Lista lekova</strong><small>Informacije o lekovima na teret zdravstvenog osiguranja</small></span><b>↗</b></a></div><div class="official-note">Ako naziv proizvoda ili jačina nisu isti kao na ovoj stranici, merodavno je zvanično uputstvo konkretnog proizvoda.</div><a class="med-search-official" target="_blank" rel="noopener" href="https://www.google.com/search?q=${encodeURIComponent(m.name+' '+m.active+' site:alims.gov.rs OR site:registar.alims.gov.rs')}">Pretraži zvanične srpske izvore ↗</a></aside></div>${relatedTopicsBlock(m)}${similarBlock(m)}</main>${nav()}${compareTray()}`}
